name: Package and Push Helm Chart

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - "helm-chart/**"
      - ".github/workflows/helm-ci.yml"
  pull_request:
    branches:
      - master
    paths:
      - "helm-chart/**"
      - ".github/workflows/helm-ci.yml"

permissions:
  contents: "read"
  id-token: "write"

env:
  PROJECT_ID: open-source-apps-001
  GOOGLE_ARTIFACT_REGISTRY_LOCATION: europe-west1
  GOOGLE_ARTIFACT_REGISTRY_REPO: gcp-helm-charts
  CHART_DIR: ./helm-chart

jobs:
  lint-and-validate:
    name: Lint and Validate Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Helm Chart
        run: |
          helm lint ${{ env.CHART_DIR }}

      - name: Dry-Run Template Rendering
        run: |
          # Ensures templates render valid YAML without needing a live cluster
          helm template release-test ${{ env.CHART_DIR }} > /dev/null

  package-and-push:
    name: Package and Push to Artifact Registry
    needs: lint-and-validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: ${{ secrets.PROVIDER_NAME }}
          service_account: ${{ secrets.SA_EMAIL }}

      - name: Authenticate Helm with Artifact Registry
        run: |
          gcloud auth print-access-token | helm registry login ${{ env.GOOGLE_ARTIFACT_REGISTRY_LOCATION }}-docker.pkg.dev --username oauth2accesstoken --password-stdin

      - name: Package Helm Chart
        run: |
          # Optional: If triggered by a git tag (e.g., v1.2.0), override chart version & appVersion
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
            CLEAN_VERSION="${VERSION#v}" # Strips leading 'v' for SemVer compliance
            helm package ${{ env.CHART_DIR }} --version "$CLEAN_VERSION" --app-version "$VERSION"
          else
            helm package ${{ env.CHART_DIR }}
          fi

      - name: Push Helm Chart to Artifact Registry
        run: |
          CHART_ARCHIVE=$(ls *.tgz)
          helm push "$CHART_ARCHIVE" oci://${{ env.GOOGLE_ARTIFACT_REGISTRY_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GOOGLE_ARTIFACT_REGISTRY_REPO }}
