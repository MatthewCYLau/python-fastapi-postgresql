apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: python-fastapi-postgresql-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: python-fastapi-postgresql
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
